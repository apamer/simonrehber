<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Simon Says Seans Rehberim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Sade görünüm: nötr zemin, koyu mürekkep, tek vurgu rengi (logoyla uyumlu koyu mor).
   Kitap renkleri yalnızca küçük işaret: oturum numarası rozeti, oturum başlığında ince sol çizgi, grup başlığında nokta.
   Hiyerarşi renkle değil; boyut, kalınlık, boşluk ve ince çizgilerle kurulur. */
:root{
  --bg:#F5F6F7; --surface:#FFFFFF; --soft:#EEF0F2; --ink:#1E2427; --muted:#525E65; --line:#DCE1E4; --line-2:#7A868C;
  --acc:#6A2A6C; --acc-d:#521F54; --acc-s:#F5EEF5; --acc-s2:#EADDEB; --on-acc:#FFFFFF;
  /* kitap renkleri (yalnızca işaret) */
  --slate:#56636A; --teal:#1F6F7A; --rust:#B8521C; --plum:#8A3C8C; --blue:#2E5C9A;
  --slate-s:#EEF0F2; --teal-s:#EAF4F5; --rust-s:#FDF1E9; --plum-s:#F5ECF5; --blue-s:#E8EEF7;
  --on:#FFFFFF;
  --f-display:'Lexend',system-ui,sans-serif; --f-body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121517; --surface:#1A1F22; --soft:#232A2E; --ink:#E6EBED; --muted:#A3AEB3; --line:#2E373B; --line-2:#7E8A90;
  --acc:#D3A6D6; --acc-d:#E4C3E6; --acc-s:#2A2030; --acc-s2:#3A2B40; --on-acc:#1A1220;
  --slate:#7E8A90; --teal:#3E9AA6; --rust:#C9642C; --plum:#B06BB2; --blue:#5A88C6;
  --slate-s:#232A2E; --teal-s:#16302F; --rust-s:#33221A; --plum-s:#2E2030; --blue-s:#1C2636; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121517; --surface:#1A1F22; --soft:#232A2E; --ink:#E6EBED; --muted:#A3AEB3; --line:#2E373B; --line-2:#7E8A90;
  --acc:#D3A6D6; --acc-d:#E4C3E6; --acc-s:#2A2030; --acc-s2:#3A2B40; --on-acc:#1A1220;
  --slate:#7E8A90; --teal:#3E9AA6; --rust:#C9642C; --plum:#B06BB2; --blue:#5A88C6;
  --slate-s:#232A2E; --teal-s:#16302F; --rust-s:#33221A; --plum-s:#2E2030; --blue-s:#1C2636; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.stripe{display:none}

/* üst bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0;min-height:44px}
.logo{height:40px;width:auto;display:block}
:root[data-theme="dark"] .logo{filter:brightness(1.9) saturate(.8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(1.9) saturate(.8)}}
.brand .sr{font-family:var(--f-display);font-weight:500;font-size:18px;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.back{margin-left:auto;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.back:hover{border-color:var(--acc);color:var(--acc)}
@media (max-width:480px){.bar .wrap{flex-wrap:nowrap;gap:8px}.logo{height:34px}.brand .sr{font-size:15px;padding-left:8px;white-space:nowrap}.back{padding:6px 12px;font-size:13px;white-space:nowrap}}

/* ana ekran */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero .wrap{display:flex;align-items:center;gap:28px;padding-block:24px}
.hero img{width:min(220px,32vw);height:auto;flex-shrink:0;mix-blend-mode:multiply}
:root[data-theme="dark"] .hero img{mix-blend-mode:normal;background:#fff;border-radius:16px;padding:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero img{mix-blend-mode:normal;background:#fff;border-radius:16px;padding:6px}}
.hero h1{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);font-weight:600;line-height:1.2;margin:0 0 10px;text-wrap:balance}
.hero h1 span{color:var(--acc)}
.hero p{margin:0;max-width:60ch;color:var(--muted)}
.phases{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.phases span{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:500;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px}
.phases b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--acc-s);color:var(--acc);font-size:13px}
@media (max-width:560px){.hero .wrap{flex-direction:column;align-items:flex-start;gap:16px}.hero img{width:170px}}

main{padding-block:8px 64px}
.book{margin-top:32px}
.bookh{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;padding:0 2px 10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.bookh .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bookh .tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--bc);flex-shrink:0}
.bookh h2{font-family:var(--f-display);font-size:19px;font-weight:600;margin:0}
.bookh .sk{margin-left:auto;display:inline;background:none;padding:0;font-weight:400;font-size:14px;line-height:1.4;color:var(--muted);vertical-align:baseline}
.bookh .sk::before{content:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.card{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line-2);box-shadow:0 2px 10px rgba(20,30,35,.07)}
.num{width:40px;height:40px;border-radius:10px;border:2px solid var(--bc);background:var(--surface);color:var(--bc);font-family:var(--f-display);font-weight:700;font-size:19px;display:grid;place-items:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.ct{display:flex;flex-direction:column;gap:4px;min-width:0}
.ct b{font-family:var(--f-display);font-size:15px;font-weight:600;line-height:1.35}
.ct .meta{font-size:14px;color:var(--muted)}
.pill{align-self:flex-start;font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px;margin-top:2px;border:1px solid var(--line);color:var(--muted)}
.pill.doneP{border-color:transparent;background:var(--acc-s);color:var(--acc-d)}
:root:not([data-theme="dark"]) .pill.doneP{color:var(--acc)}

/* oturum başlığı */
.shead{border-radius:14px;padding:20px 22px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bc);margin-top:18px;display:flex;gap:20px;align-items:center;position:relative;overflow:hidden}
.shead .big{font-family:var(--f-display);font-weight:600;font-size:56px;line-height:.9;color:var(--ink);font-variant-numeric:tabular-nums}
.shead .k{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.shead h1{font-family:var(--f-display);font-size:clamp(22px,3.2vw,28px);font-weight:600;line-height:1.25;margin:4px 0 10px;text-wrap:balance}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.facts span{background:var(--soft);border-radius:999px;padding:2px 11px;font-size:14px;font-weight:600;color:var(--ink)}
.shead .idea{margin:14px 0 0;font-size:16px;line-height:1.5;max-width:64ch;color:var(--ink)}
.shead .idea b{font-weight:700}
.why{margin:10px 16px 0;font-size:15px;line-height:1.5;color:var(--ink);max-width:74ch}
.why b{font-weight:700}
.sico{width:112px;height:112px;margin-left:auto;background:#FFFFFF;border:1px solid var(--line);border-radius:18px;padding:8px;flex-shrink:0}
.sico svg{width:100%;height:100%;display:block}
@media (max-width:640px){.shead{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;padding:16px}.shead>div{grid-column:1/-1;grid-row:2}.sico{grid-row:1;grid-column:2;justify-self:end;width:64px;height:64px;padding:5px;border-radius:12px}.shead .big{font-size:44px;align-self:center}}

/* bölüm sekmeleri */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;min-width:0;min-height:44px}
.tab:hover{border-color:var(--line-2)}
.tab .ring{--p:0;width:40px;height:40px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.tab .ring b{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:var(--ink)}
.tab .tx{display:flex;flex-direction:column;min-width:0}
.tab .tx small{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.tab .tx strong{font-family:var(--f-display);font-size:16px;font-weight:600;line-height:1.25}
.tab .tx em{font-style:normal;font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--acc);background:var(--acc-s);box-shadow:inset 0 -3px 0 var(--acc)}
.tab[aria-selected="true"] .ring b{background:var(--acc-s);color:var(--acc)}
@media (max-width:620px){.tabs{gap:6px}.tab{flex-direction:column;align-items:flex-start;gap:6px;padding:10px}.tab .tx strong{font-size:14px}.tab .tx em{display:none}}

.panel{background:var(--surface);border-radius:14px;padding:18px 20px;border:1px solid var(--line)}
@media (max-width:620px){.panel{padding:14px 12px}}
.lead{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:6px;font-weight:600}
.grp{display:flex;flex-direction:column;gap:2px;padding-block:14px;border-bottom:1px solid var(--line)}
.grp:last-of-type{border-bottom:0}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.gi{width:32px;height:32px;border-radius:8px;background:var(--soft);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.gi svg{width:18px;height:18px}
.gh h4{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:9px 10px;border-radius:8px;max-width:74ch;min-height:44px}
.chk:hover{background:var(--soft)}
.chk input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--line-2);border-radius:6px;flex-shrink:0;margin:0;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
.chk input:checked{background:var(--acc);border-color:var(--acc)}
.chk input:checked::after{content:"";width:6px;height:12px;border:solid var(--on-acc);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:checked ~ .lt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.lt{flex:1;min-width:0}
.sk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:0 9px;margin-left:6px;vertical-align:1px;background:var(--soft);color:var(--ink);line-height:1.6;text-decoration:none}
.sk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--skc,var(--slate));flex-shrink:0}
.note{margin:2px 10px;color:var(--muted)}
.prevbox{margin:4px 10px 6px;border-radius:10px;background:var(--soft);padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px 16px;font-size:15px}
.prevbox span{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prevbox b{font-weight:600}

/* zaman çubuğu ve etkinlik kartları */
.tl{display:flex;gap:2px;border-radius:10px;overflow:hidden;margin:2px 0 14px}
.tl button{border:0;background:var(--acc-s2);color:var(--acc-d);font-family:var(--f-display);font-size:12px;padding:6px 8px;text-align:left;cursor:pointer;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.tl button:nth-child(even){background:var(--acc-s)}
.tl button:hover{background:var(--acc);color:var(--on-acc)}
.tl button:focus-visible{outline-offset:-3px}
.tl b{font-size:15px}
.tl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:90px;background:var(--surface)}
.act + .act{margin-top:12px}
.acth{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.acth .an{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--on-acc);font-family:var(--f-display);font-weight:700;font-size:15px;display:grid;place-items:center;flex-shrink:0}
.acth b{font-family:var(--f-display);font-size:17px;font-weight:600;flex:1;min-width:0}
.acth .ok{font-family:var(--f-display);font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;padding:12px 16px 0}
.tags span{border-radius:999px;padding:1px 10px;font-weight:600;background:var(--soft);color:var(--ink)}
.tags .t-dk{background:var(--acc-s);color:var(--acc-d)}
:root:not([data-theme="dark"]) .tags .t-dk{color:var(--acc)}
.act .items{padding:6px 6px 10px}

.field{display:flex;flex-direction:column;gap:4px;max-width:74ch;padding:6px 10px}
.field label{font-weight:600;font-size:15px}
.field input{font:inherit;min-height:44px;border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;background:var(--surface);color:var(--ink)}
.field input:focus{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:0}
.done{margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:12px;padding:14px 16px;background:var(--soft)}
.done button{border:1px solid var(--acc);background:var(--acc);color:var(--on-acc);border-radius:10px;padding:11px 20px;min-height:44px;font-family:var(--f-display);font-weight:600;font-size:16px;cursor:pointer}
.done button:hover{background:var(--acc-d);border-color:var(--acc-d)}
.done.is button{background:var(--surface);color:var(--acc)}
.done.is button:hover{background:var(--acc-s)}
.foot{font-size:14px;color:var(--muted);margin-top:14px}
.empty{display:flex;flex-direction:column;gap:6px;max-width:60ch}
.empty h3{font-family:var(--f-display);margin:0;font-size:19px;font-weight:600}
.nextp{display:flex;justify-content:flex-end;margin-top:14px}
.nextp button{border:1px solid var(--acc);background:var(--surface);color:var(--acc);border-radius:10px;padding:10px 18px;min-height:44px;font-family:var(--f-display);font-weight:600;cursor:pointer}
.nextp button:hover{background:var(--acc-s)}

.tlnote{font-size:13px;color:var(--muted);margin:-8px 0 12px}
.reset{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.reset h4{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0}
.reset p{margin:0;color:var(--muted);font-size:15px;max-width:74ch}
.reset .rb{display:flex;gap:10px;flex-wrap:wrap}
.reset .rb button{border:1px solid transparent;border-radius:10px;padding:10px 22px;min-height:44px;font-family:var(--f-display);font-weight:600;font-size:15px;cursor:pointer}
.reset .ry{background:var(--acc);color:var(--on-acc)}
.reset .ry:hover{background:var(--acc-d)}
.reset .rn{background:var(--surface);border-color:var(--line-2)!important;color:var(--ink)}
.reset label{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer;min-height:44px}
.reset label input{width:20px;height:20px;accent-color:var(--acc);flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--ink);color:var(--surface);border-radius:999px;padding:11px 20px;font-family:var(--f-display);font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2)}
/* Adım 3: gizlilik uyarısı, bilgi bandı, yazdır düğmesi, telefonda zaman çubuğu */
.warn{margin:8px 10px 4px;max-width:74ch;font-size:14px;line-height:1.45;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.warn b{color:var(--ink)}
.band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0 6px}
.band div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.band b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:4px}
.band p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
@media (max-width:760px){.band{grid-template-columns:1fr}}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.printb{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-weight:600;font-size:14px;cursor:pointer;margin:16px 0 4px}
.printb:hover{border-color:var(--acc);color:var(--acc)}
.printb svg{width:18px;height:18px}
@media (max-width:560px){.tl button{min-width:52px;padding:6px}.tl span{white-space:normal;overflow:visible;text-overflow:clip;font-size:11px}}
#print{display:none}
/* A4 seans planı (ekranda gizli; yazdırırken görünür) */
#print{font-family:var(--f-body);font-size:9pt;line-height:1.3;color:#111;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#print h1{font-family:var(--f-display);font-size:15pt;margin:0;line-height:1.15}
#print .ph{display:flex;align-items:center;gap:12px;border-bottom:1.5pt solid #111;padding-bottom:6px}
#print .ph img{height:30px}
#print .ph .n{font-family:var(--f-display);font-size:22pt;font-weight:700;border:1.2pt solid #111;border-radius:8px;width:40px;height:40px;display:grid;place-items:center;flex-shrink:0}
#print .ph small{display:block;font-size:7.5pt;letter-spacing:.08em;text-transform:uppercase;color:#555}
#print .pf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:8px 0 4px}
#print .pf div{font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:#555;border-bottom:1pt solid #111;padding-bottom:9px}
#print .idea{margin:6px 0;font-style:italic}
#print h2{font-family:var(--f-display);font-size:8.5pt;letter-spacing:.1em;text-transform:uppercase;margin:7px 0 3px;border-bottom:.6pt solid #999;padding-bottom:2px}
#print .cols{columns:2;column-gap:16px}
#print .pg{break-inside:avoid;margin:0 0 3px}
#print .pg b{font-size:8.5pt}
#print .pg ul{margin:1px 0 0;padding-left:14px}
#print .pa{display:grid;grid-template-columns:22px 1fr;gap:1px 8px;padding:3px 0;border-bottom:.5pt dotted #999;break-inside:avoid}
#print .pa .no{width:20px;height:20px;border:1pt solid #111;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:8.5pt}
#print .pa .t{font-weight:700;font-size:9.5pt}
#print .pa .m{display:block;font-size:8pt;color:#444}
#print .box{display:flex;gap:6px;margin-top:1px}
#print .box::before{content:"";width:9px;height:9px;border:1pt solid #111;border-radius:2px;flex-shrink:0;margin-top:2px}
#print .fl{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:4px}
#print .fl div{font-size:8pt;color:#444;border-bottom:.6pt solid #999;padding-bottom:10px}
#print .fl div b{color:#111;font-weight:600}
#print .lines div{border-bottom:.6pt solid #bbb;height:16px}
#print .ft{margin-top:8px;font-size:7.5pt;color:#666;display:flex;justify-content:space-between;border-top:.6pt solid #bbb;padding-top:4px}
@media print{
  @page{size:A4;margin:10mm 12mm}
  html,body{background:#fff!important;color:#111}
  body>*:not(#print){display:none!important}
  #print{display:block}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

   Her oturumun içeriği oturumlar/oturum-NN.json dosyasında durur (alanların anlamı: oturumlar/README.md).
   Sayfa açılırken 20 dosya birlikte yüklenir; yüklenemeyen oturum "Hazırlanacak" görünür. */
const DATA={};
const ACT_C=["slate","teal","rust","plum","blue","teal-d","plum-d"];

/* ---- saklama: yalnızca bu cihaz ---- */
const mem={};
const st=k=>{if(k in mem)return mem[k];try{const v=localStorage.getItem("ssr:"+k);return v===null?null:JSON.parse(v)}catch(e){return null}};
const put=(k,v)=>{mem[k]=v;try{localStorage.setItem("ssr:"+k,JSON.stringify(v))}catch(e){}};
const $=id=>document.getElementById(id);
const cv=c=>`--bc:var(--${c});--bs:var(--${c}-s)`;
const pv=p=>`--pc:var(--acc);--ps:var(--acc-s)`;

let noReset={};
function resetHTML(n){
  if(!st(`s${n}done`)||noReset[n])return "";
  return `<div class="reset" role="group" aria-label="İşaretleri temizle"><h4>Seans bitti. Başka bir seans için işaretler kaldırılsın mı?</h4>
  <p>Portal veri tutmaz; aynı oturumu başka bir çocukla uygulayacaksan işaretleri temizleyebilirsin. Bu oturumdaki bütün işaretler ve "tamamlandı" durumu silinir.</p>
  <label><input type="checkbox" id="rNotes"> Kayıt alanlarındaki notları da sil (bir sonraki oturumda görünmez)</label>
  <div class="rb"><button type="button" class="ry" data-reset="yes">Evet, temizle</button><button type="button" class="rn" data-reset="no">Hayır</button></div></div>`}
function clearSession(n,notes){
  const re=new RegExp(`^s${n}(p\\d|q\\d|done${notes?"|f":""})`);
  Object.keys(mem).forEach(k=>{if(re.test(k))delete mem[k]});
  try{Object.keys(localStorage).forEach(k=>{if(k.startsWith("ssr:")&&re.test(k.slice(4)))localStorage.removeItem(k)})}catch(e){}
}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function keys(n,p){const out=[];const P=DATA[n].phases[p];P.forEach((b,bi)=>{(b.i||[]).forEach((_,i)=>out.push(`s${n}p${p}b${bi}i${i}`))});return out}
function pct(n,p){const k=keys(n,p);if(!k.length)return 0;return Math.round(100*k.filter(x=>st(x)).length/k.length)}

function home(){
  $("home").hidden=true;
  let h=`<section class="hero"><div class="wrap gut"><img src="${IMG}" alt="Simon ve dört beyin becerisi: Çalışma Belleği, Bilişsel Esneklik, Tepki Engelleme, Sonuç Odaklı Düşünme">
  <div><h1>Hangi oturuma <span>hazırlanıyorsun?</span></h1>
  <p>Basılı uygulama kılavuzunun yanında kullanılır. Her oturumda ne yapacağını üç adımda gösterir; ayrıntı için kılavuzun ilgili sayfasına yönlendirir.</p>
  <div class="phases">${PH.map(p=>`<span><b>${p.n}</b>${p.t}</span>`).join("")}</div></div></div></section><main class="gut"><div class="wrap">
  <div class="band" aria-label="Bu portal hakkında">
    <div><b>Kılavuzun yanında</b><p>Kılavuzu ve eğitimi tekrar etmez. Takıldığınızda bakacağınız kısa notlar, formlar ve kılavuz sayfalarıdır.</p></div>
    <div><b>Seanstan önce</b><p>Oturumu açın, gerekenleri hazırlayın; isterseniz tek sayfalık seans planını yazdırıp seansta kâğıttan izleyin.</p></div>
    <div><b>Bu cihazda saklanır</b><p>İşaretler ve notlar hiçbir yere gönderilmez. Kayıt alanlarına isim değil kısaltma yazın.</p></div>
  </div>`;
  BOOKS.forEach((b,bi)=>{
    h+=`<section class="book" style="${cv(b.c)}"><div class="bookh"><span class="tag">${b.tag}</span><h2>${b.name}</h2><span class="sk">${b.sk}</span></div><div class="grid">`+
    SESS.filter(s=>s[1]===bi).map(s=>{const r=!!DATA[s[0]];const d=st(`s${s[0]}done`);
      const pill=d?`<span class="pill doneP">✓ Tamamlandı</span>`:r?`<span class="pill ready">Hazır</span>`:`<span class="pill pend">Hazırlanacak</span>`;
      return `<button class="card ${r?'ready':''}" type="button" data-s="${s[0]}"><span class="num">${s[0]}</span><span class="ct"><b>${s[2]}</b><span class="meta">${s[3]}</span>${pill}</span></button>`}).join("")+`</div></section>`;
  });
  $("view").innerHTML=h+`</div></main>`;
  try{history.replaceState(null,"","#ana")}catch(e){}
}

/* Formlar yalnızca adı, numarası ve sayfasıyla anılır; PDF bağlantısı verilmez. */
function item(id,txt,extra){const on=st(id)?"checked":"";return `<label class="chk"><input type="checkbox" data-k="${id}" ${on}><span class="lt">${txt}${extra&&SK[extra]?sk(extra):""}</span></label>`}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* Kayıt alanlarının üstündeki gizlilik uyarısı */
const WARN=`<p class="warn"><b>Bu cihazda saklanır.</b> Çocuğun ya da ailenin adını yazmayın; kısaltma ya da kod kullanın (ör. "Koç: anne"). Ortak bir bilgisayarda başkaları görebilir.</p>`;

function phaseHTML(n,p){
  const P=DATA[n].phases[p]; let h="";
  if(p===1){
    const acts=P.filter(b=>b.a);
    /* Aynı kılavuz adımına (no) ait etkinlikler zaman çubuğunda tek parça görünür; "sure" varsa süre olarak o yazılır. */
    const tg=[];acts.forEach(b=>{const k=b.no||b.a,g=tg[tg.length-1];if(g&&g.k===k){g.dk+=b.dk;g.t.push(b.t)}else tg.push({k,a:b.a,dk:b.dk,s:b.sure,t:[b.t]})});
    h+=`<div class="tl" aria-label="Oturum akışı">${tg.map((g,i)=>`<button type="button" data-jump="a${g.a}" style="flex:${g.dk}" title="${g.t.join(" · ")}"><b>${g.k}</b><span>${g.s||g.dk+" dk"}</span></button>`).join("")}</div><p class="tlnote">Süreler kesin değil, tahmini öneridir.</p>`;
  }
  P.forEach((b,bi)=>{
    const base=`s${n}p${p}b${bi}`;
    if(b.a){
      const ks=b.i.map((_,i)=>base+"i"+i); const dn=ks.filter(k=>st(k)).length;
      h+=`<article class="act" id="a${b.a}"><div class="acth"><span class="an">${b.no||b.a}</span><b>${b.t}</b><span class="ok" data-ok="${base}">${dn}/${ks.length}</span></div>
      <div class="tags"><span class="t-dk">${b.sure||b.dk+" dk"}</span>${b.mat?`<span class="t-mat">Materyal: ${b.mat}</span>`:""}${b.koc?`<span class="t-koc">${b.koc}</span>`:""}<span>Kılavuz ${b.ref}</span></div>${b.neden?`<p class="why"><b>Amaç:</b> ${b.neden}</p>`:""}
      <div class="items">${b.i.map((x,i)=>Array.isArray(x)?item(base+"i"+i,x[0],x[1]):item(base+"i"+i,x)).join("")}</div></article>`;return}
    if(b.done){const d=st(`s${n}done`);h+=`<div class="done ${d?'is':''}"><button type="button" id="doneBtn">${d?"✓ Seans tamamlandı":"Seansı tamamlandı olarak işaretle"}</button><span>${d?"Ana ekranda bu oturum tamamlandı olarak görünür.":"Bütün maddeleri bitirdiğinde işaretle."}</span></div>`+resetHTML(n);return}
    h+=`<div class="grp"><div class="gh"><span class="gi">${ICON[b.ic]||""}</span><h4>${b.g}</h4></div>`;
    if(b.note) h+=`<p class="note">${b.note}</p>`;
    if(b.prev){const vals=b.pf.map(f=>[f[1],st(`s${b.prev}f${f[0]}`)]);const any=vals.some(v=>v[1]);
      h+=`<div class="prevbox">${any?vals.map(v=>`<div><span>${v[0]}</span><b>${v[1]?esc(v[1]):"—"}</b></div>`).join(""):`<p style="margin:0">${b.prev}. Oturumda henüz not kaydedilmedi. Notlar, o oturumun “Seansı tamamla” bölümünde girildiğinde burada görünür.</p>`}</div>`}
    if(b.i) h+=b.i.map((x,i)=>Array.isArray(x)?item(base+"i"+i,x[0],x[1]):item(base+"i"+i,x)).join("");
    if(b.f) h+=WARN+b.f.map(f=>`<div class="field"><label for="f${n}${f[0]}">${f[1]}</label><input id="f${n}${f[0]}" data-f="s${n}f${f[0]}" autocomplete="off" value="${esc(st(`s${n}f${f[0]}`)||"")}"></div>`).join("");
    h+=`</div>`;
  });
  if(p<2) h+=`<div class="nextp"><button type="button" data-ph="${p+1}">Sonraki: ${PH[p+1].t} →</button></div>`;
  return h+`<p class="foot">İşaretler ve notlar yalnızca bu cihazda saklanır.</p>`;
}

let curS=0,curP=0;
function shead(n){const s=SESS[n-1],b=BOOKS[s[1]],D=DATA[n];
  return `<section class="shead" style="${cv(b.c)}"><span class="big">${n}</span><div><div class="k">${b.tag} · ${s[3]}</div><h1>${s[2]}</h1>${D?`<div class="facts">${D.facts.map(f=>`<span>${f}</span>`).join("")}</div>`:""}${D&&D.fikir?`<p class="idea"><b>Oturumun fikri:</b> ${D.fikir}</p>`:""}</div>${SICON[n]?`<span class="sico">${SICON[n]}</span>`:""}</section>`}
const PRINT_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></svg>';
/* Tek sayfalık A4 seans planı: oturumun bütün maddeleri, seansta işaretlemek için boş kutularla. */
function printPlan(n){
  const s=SESS[n-1],b=BOOKS[s[1]],D=DATA[n];if(!D)return;const P=D.phases;
  const T=x=>Array.isArray(x)?x[0]:x;
  const grp=g=>{let v="";
    if(g.prev){const vals=g.pf.map(f=>[f[1],st(`s${g.prev}f${f[0]}`)]).filter(x=>x[1]);if(vals.length)v=vals.map(x=>`${x[0]}: <b>${esc(x[1])}</b>`).join(" · ")+(g.i?" · ":"")}
    return `<p class="pg"><b>${g.g}:</b> ${g.note||""}${v}${g.i?g.i.map(T).join(" · "):""}</p>`};
  const before=P[0].map(grp).join("");
  const flow=P[1].filter(a=>a.a).map(a=>`<div class="pa"><span class="no">${a.no||a.a}</span><div><span class="t">${a.t}</span><span class="m">${[a.sure||a.dk+" dk",a.koc,a.mat?"Materyal: "+a.mat:"","Kılavuz "+a.ref].filter(Boolean).join(" · ")}</span>${a.i.map(x=>`<span class="box">${T(x)}</span>`).join("")}</div></div>`).join("");
  const after=P[2].filter(g=>g.i).map(grp).join("");
  const sv=P[2].find(g=>g.f);
  const fields=sv?`<h2>${sv.g}</h2><div class="fl">${sv.f.map(f=>{const v=st(`s${n}f${f[0]}`);return `<div>${f[1]}${v?`: <b>${esc(v)}</b>`:""}</div>`}).join("")}</div>`:"";
  const logo=document.querySelector("#brand img");
  $("print").innerHTML=`<div class="ph">${logo?`<img src="${logo.src}" alt="">`:""}<span class="n">${n}</span><div><small>Seans planı · ${b.tag} · ${s[3]}</small><h1>${s[2]}</h1><small>${D.facts.join(" · ")}</small></div></div>
   <div class="pf"><div>Tarih</div><div>Çocuk kodu</div><div>Koç</div></div>
   ${D.fikir?`<p class="idea">${D.fikir}</p>`:""}
   <h2>Seansa hazırlan</h2><div class="cols">${before}</div>
   <h2>Seansı uygula</h2>${flow}
   <h2>Seansı tamamla</h2><div class="cols">${after}</div>${fields}
   <h2>Notlar</h2><div class="lines"><div></div><div></div><div></div></div>
   <div class="ft"><span>Simon Says · Seans Rehberim · ${n}. Oturum</span><span>Ayrıntılar basılı Uygulayıcı Kılavuzu'nda</span></div>`;
  try{window.print()}catch(e){}
}
/* Tek görünüm: oturum doğrudan rehberle açılır; üstte yalnızca yazdır düğmesi. */
function tools(n){return DATA[n]?`<div class="tools"><button type="button" class="printb" id="printBtn">${PRINT_ICON}Seans planını yazdır</button></div>`:""}
function session(n,p=0){
  curS=n;curP=p;
  const s=SESS[n-1],b=BOOKS[s[1]],D=DATA[n];
  $("home").hidden=false;
  const tabs=PH.map((ph,i)=>{const v=D?pct(n,i):0;return `<button class="tab" role="tab" type="button" data-ph="${i}" aria-selected="${i===p}" style="${pv(i)}"><span class="ring" style="--p:${v}"><b>${ph.n}</b></span><span class="tx"><small>BÖLÜM ${ph.n}</small><strong>${ph.t}</strong><em>${ph.e}</em></span></button>`}).join("");
  $("view").innerHTML=`<main class="gut"><div class="wrap">
   ${shead(n)}${tools(n)}
   <div class="tabs" role="tablist">${tabs}</div>
   <div class="panel" style="${pv(p)}">${D?phaseHTML(n,p):`<div class="empty"><h3>${PH[p].t}: hazırlanıyor</h3><p style="margin:0">Bu oturumun kontrol listesi henüz eklenmedi.</p></div>`}</div>
  </div></main>`;
  try{history.replaceState(null,"","#oturum-"+n)}catch(e){}
}
function refresh(){
  if(!DATA[curS])return;
  document.querySelectorAll(".tab").forEach((t,i)=>t.querySelector(".ring").style.setProperty("--p",pct(curS,i)));
  document.querySelectorAll("[data-ok]").forEach(el=>{const b=el.dataset.ok;const all=[...document.querySelectorAll(`[data-k^="${b}i"]`)];el.textContent=all.filter(x=>x.checked).length+"/"+all.length});
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-s]"); if(c){session(+c.dataset.s,0);window.scrollTo({top:0});return}
  const t=e.target.closest("[data-ph]"); if(t){session(curS,+t.dataset.ph);document.querySelector(".tabs").scrollIntoView({block:"start",behavior:"smooth"});return}
  const j=e.target.closest("[data-jump]"); if(j){$(j.dataset.jump).scrollIntoView({behavior:"smooth"});return}
  const rs=e.target.closest("[data-reset]"); if(rs){const n=curS;
    if(rs.dataset.reset==="yes"){const notes=$("rNotes")&&$("rNotes").checked;clearSession(n,notes);session(n,0);window.scrollTo({top:0});toast(notes?"İşaretler ve notlar temizlendi":"İşaretler temizlendi")}
    else{noReset[n]=true;rs.closest(".reset").remove()}return}
  if(e.target.closest("#printBtn")){printPlan(curS);return}
  if(e.target.id==="doneBtn"){const k=`s${curS}done`;put(k,!st(k));delete noReset[curS];session(curS,curP);return}
});
document.addEventListener("change",e=>{if(e.target.dataset.k){put(e.target.dataset.k,e.target.checked);refresh()}});
document.addEventListener("input",e=>{if(e.target.dataset.f)put(e.target.dataset.f,e.target.value)});
$("home").onclick=()=>{home();window.scrollTo({top:0})};
$("brand").onclick=()=>{home();window.scrollTo({top:0})};
/* ---- açılış: oturum dosyalarını yükle, sonra ekranı çiz ---- */
function loadSession(n){
  return fetch(`oturumlar/oturum-${String(n).padStart(2,"0")}.json`,{cache:"no-cache"})
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
    .then(d=>{DATA[n]=d})
    .catch(e=>{console.warn(`${n}. oturum yüklenemedi:`,e)});
}
function start(){
  /* Eski bağlantılar (#oturum-N/hizli, #oturum-N/rehber) da oturumu açar. */
  const m=location.hash.match(/^#oturum-(\d+)(?:\/(hizli|rehber))?$/);
  if(m&&+m[1]>=1&&+m[1]<=20)session(+m[1],0);else home();
}
Promise.all(SESS.map(s=>loadSession(s[0]))).then(start);
</script>
</body>
</html>
